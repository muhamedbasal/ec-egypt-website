name: Deploy to Hostinger (FTP)

# Runs on every push to main, or manually from the Actions tab.
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.ec-egypt.com  (or the IP/host shown in hPanel → FTP Accounts)
#   FTP_USERNAME  your Hostinger FTP username
#   FTP_PASSWORD  your Hostinger FTP password
# Until those secrets exist the job will fail — that is expected; add them once.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          # Don't ship dev-only files to the live server
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            BUILD_SPEC.md
            README.md
            .gitignore
